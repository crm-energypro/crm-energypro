<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EnergyPro CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #00AEEF;
  --primary-dark: #0090CC;
  --primary-light: #E0F5FD;
  --secondary: #FF6B35;
  --secondary-light: #FFF0EB;
  --accent: #4CAF50;
  --accent-light: #E8F5E9;
  --bg: #F4F9FF;
  --surface: #FFFFFF;
  --text: #1A3A4A;
  --text2: #5B7A8A;
  --text3: #8FA8B5;
  --border: #D6EAF8;
  --shadow: rgba(0,174,239,0.10);
  --shadow-md: rgba(0,174,239,0.18);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --estado-factura: #F59E0B; --estado-factura-bg: #FEF3C7;
  --estado-propuesta: #3B82F6; --estado-propuesta-bg: #DBEAFE;
  --estado-ganado: #10B981; --estado-ganado-bg: #D1FAE5;
  --estado-perdido: #EF4444; --estado-perdido-bg: #FEE2E2;
  --estado-ahorro: #8B5CF6; --estado-ahorro-bg: #EDE9FE;
  --estado-comision: #EC4899; --estado-comision-bg: #FCE7F3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
h1,h2,h3,h4 { font-family: 'Nunito', sans-serif; }
textarea { resize: vertical; min-height: 80px; }
.hidden { display: none !important; }
.page { display: none; }
.page.active { display: block; }

/* AUTH */
#auth-screen { min-height:100vh; background:linear-gradient(135deg,#E0F5FD 0%,#FFF0EB 50%,#E8F5E9 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
.auth-card { background:var(--surface); border-radius:24px; padding:40px 36px; width:100%; max-width:420px; box-shadow:0 20px 60px var(--shadow-md); }
.auth-logo { text-align:center; margin-bottom:32px; }
.logo-icon-sq { width:72px; height:72px; background:#FF6B35; border-radius:20px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.auth-logo h1 { font-size:28px; font-weight:900; }
.auth-logo p { color:var(--text2); font-size:13px; margin-top:4px; }
.auth-tabs { display:flex; background:var(--bg); border-radius:var(--radius-sm); padding:4px; margin-bottom:24px; }
.auth-tab { flex:1; padding:8px; border:none; background:transparent; border-radius:var(--radius-xs); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:var(--text2); transition:all .2s; }
.auth-tab.active { background:var(--surface); color:var(--primary); font-weight:600; box-shadow:0 2px 8px var(--shadow); }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:var(--text2); margin-bottom:6px; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text); background:var(--surface); transition:all .2s; outline:none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
.auth-error { background:#FEE2E2; color:#EF4444; padding:10px 14px; border-radius:var(--radius-xs); font-size:13px; margin-bottom:16px; display:none; }

/* BUTTONS */
.btn-primary { width:100%; padding:14px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none; border-radius:var(--radius-sm); font-family:'Nunito',sans-serif; font-size:16px; font-weight:700; cursor:pointer; transition:all .2s; box-shadow:0 4px 16px rgba(0,174,239,.3); }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,174,239,.4); }
.btn-secondary { padding:10px 18px; background:var(--surface); color:var(--primary); border:1.5px solid var(--primary); border-radius:var(--radius-sm); font-family:'Nunito',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all .2s; }
.btn-secondary:hover { background:var(--primary-light); }
.btn-danger { padding:8px 14px; background:#FEE2E2; color:#EF4444; border:none; border-radius:var(--radius-xs); font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; }
.btn-danger:hover { background:#EF4444; color:white; }
.btn-sm { padding:7px 14px; border-radius:var(--radius-xs); font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .2s; }
.btn-green { background:var(--accent-light); color:var(--accent); }
.btn-green:hover { background:var(--accent); color:white; }
.btn-orange { background:var(--secondary-light); color:var(--secondary); }
.btn-orange:hover { background:var(--secondary); color:white; }

/* LAYOUT */
#app { display:none; height:100vh; overflow:hidden; }
.layout { display:flex; height:100vh; }

/* SIDEBAR */
.sidebar { width:260px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; transition:all .3s; overflow-y:auto; z-index:100; }
.sidebar-logo { padding:20px 20px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.logo-mark-sm { width:40px; height:40px; background:#FF6B35; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.logo-text-nav { font-family:'Nunito',sans-serif; font-size:20px; font-weight:900; }
.logo-text-nav .e { color:#00AEEF; font-weight:700; }
.logo-text-nav .p { color:#FF6B35; font-weight:900; }
.sidebar-user { padding:14px 20px; border-bottom:1px solid var(--border); cursor:pointer; }
.sidebar-user:hover { background:var(--bg); }
.user-info { display:flex; align-items:center; gap:10px; }
.user-avatar { width:36px; height:36px; border-radius:50%; background:#FF6B35; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:14px; flex-shrink:0; overflow:hidden; }
.user-name { font-size:13px; font-weight:600; color:var(--text); }
.user-role { font-size:11px; color:var(--text2); }
.sidebar-nav { flex:1; padding:12px; }
.nav-section-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text3); padding:8px 8px 4px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; transition:all .2s; font-size:14px; font-weight:500; color:var(--text2); margin-bottom:2px; }
.nav-item:hover { background:var(--bg); color:var(--text); }
.nav-item.active { background:var(--primary-light); color:var(--primary); font-weight:600; }
.nav-icon { font-size:16px; width:20px; text-align:center; }
.nav-badge { margin-left:auto; background:var(--secondary); color:white; font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; min-width:20px; text-align:center; }

/* ACCESOS RAPIDOS JEFE */
.accesos-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 12px 12px; }
.acceso-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; text-decoration:none; transition:all .2s; }
.acceso-btn:hover { background:var(--primary-light); border-color:var(--primary); transform:translateY(-1px); }
.acceso-logo { width:100%; height:28px; object-fit:contain; }
.acceso-label { font-size:10px; font-weight:600; color:var(--text2); text-align:center; line-height:1.2; }

.sidebar-footer { padding:16px; border-top:1px solid var(--border); }
.btn-logout { width:100%; padding:10px; background:var(--bg); border:none; border-radius:var(--radius-sm); color:var(--text2); font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; transition:all .2s; text-align:left; display:flex; align-items:center; gap:8px; }
.btn-logout:hover { background:#FEE2E2; color:#EF4444; }

/* MAIN */
.main-content { flex:1; overflow-y:auto; background:var(--bg); }
.page-header { background:var(--surface); border-bottom:1px solid var(--border); padding:18px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:50; }
.page-header h2 { font-size:22px; font-weight:800; color:var(--text); }
.page-body { padding:24px 28px; }
.hamburger { display:none; background:none; border:none; cursor:pointer; padding:8px; border-radius:var(--radius-xs); color:var(--text); font-size:20px; }
.sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:99; }

/* CARDS & STATS */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--surface); border-radius:var(--radius); padding:20px; box-shadow:0 2px 12px var(--shadow); border:1px solid var(--border); transition:all .2s; }
.stat-card:hover { transform:translateY(-2px); box-shadow:0 6px 24px var(--shadow-md); }
.stat-label { font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
.stat-value { font-family:'Nunito',sans-serif; font-size:32px; font-weight:900; color:var(--text); line-height:1; margin:8px 0 4px; }
.stat-sub { font-size:12px; color:var(--text3); }
.stat-card.primary { border-left:4px solid var(--primary); }
.stat-card.secondary { border-left:4px solid var(--secondary); }
.stat-card.accent { border-left:4px solid var(--accent); }
.stat-card.purple { border-left:4px solid #8B5CF6; }
.dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.card { background:var(--surface); border-radius:var(--radius); padding:20px; box-shadow:0 2px 12px var(--shadow); border:1px solid var(--border); }
.card h3 { font-size:15px; font-weight:700; color:var(--text); margin-bottom:16px; display:flex; align-items:center; gap:8px; }

/* ESTADOS */
.estado-badge { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap; }
.estado-factura { background:var(--estado-factura-bg); color:var(--estado-factura); }
.estado-propuesta { background:var(--estado-propuesta-bg); color:var(--estado-propuesta); }
.estado-ganado { background:var(--estado-ganado-bg); color:var(--estado-ganado); }
.estado-perdido { background:var(--estado-perdido-bg); color:var(--estado-perdido); }
.estado-ahorro { background:var(--estado-ahorro-bg); color:var(--estado-ahorro); }
.estado-comision { background:var(--estado-comision-bg); color:var(--estado-comision); }

/* ESTADO SELECTOR */
.estado-selector { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.estado-btn { padding:8px 14px; border-radius:20px; border:2px solid transparent; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; opacity:.45; font-family:'DM Sans',sans-serif; }
.estado-btn:hover { opacity:.75; transform:translateY(-1px); }
.estado-btn.selected { opacity:1; border-color:currentColor; transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.12); }
.estado-btn.ef { background:var(--estado-factura-bg); color:var(--estado-factura); }
.estado-btn.ep { background:var(--estado-propuesta-bg); color:var(--estado-propuesta); }
.estado-btn.eg { background:var(--estado-ganado-bg); color:var(--estado-ganado); }
.estado-btn.epe { background:var(--estado-perdido-bg); color:var(--estado-perdido); }
.estado-btn.ea { background:var(--estado-ahorro-bg); color:var(--estado-ahorro); }
.estado-btn.ec { background:var(--estado-comision-bg); color:var(--estado-comision); }

/* FILTROS & TABLA */
.filters-bar { background:var(--surface); border-radius:var(--radius); padding:16px 20px; margin-bottom:16px; box-shadow:0 2px 8px var(--shadow); border:1px solid var(--border); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.search-wrapper { position:relative; flex:1; min-width:200px; }
.search-wrapper::before { content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; z-index:1; }
.search-input { width:100%; padding:10px 14px 10px 38px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:'DM Sans',sans-serif; color:var(--text); background:var(--bg); outline:none; transition:all .2s; }
.search-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
.filter-select { padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:'DM Sans',sans-serif; color:var(--text); background:var(--bg); outline:none; cursor:pointer; }
.filter-select:focus { border-color:var(--primary); }
.clients-table-wrap { background:var(--surface); border-radius:var(--radius); box-shadow:0 2px 12px var(--shadow); border:1px solid var(--border); overflow:hidden; }
.clients-table { width:100%; border-collapse:collapse; }
.clients-table th { background:var(--bg); padding:12px 16px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text2); border-bottom:1px solid var(--border); }
.clients-table td { padding:14px 16px; font-size:14px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; }
.clients-table tr:last-child td { border-bottom:none; }
.clients-table tbody tr { transition:background .15s; cursor:pointer; }
.clients-table tbody tr:hover { background:var(--bg); }
.client-name { font-weight:600; }
.client-cups { font-size:12px; color:var(--text2); font-family:monospace; margin-top:2px; }
.suministro-badge { padding:3px 8px; border-radius:4px; font-size:11px; font-weight:700; }
.sum-luz { background:#FEF3C7; color:#D97706; }
.sum-gas { background:#FEE2E2; color:#DC2626; }
.sum-ambos { background:#DBEAFE; color:#2563EB; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(26,58,74,.4); backdrop-filter:blur(4px); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .25s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:var(--surface); border-radius:24px; width:100%; max-width:680px; max-height:90vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,.2); transform:scale(.95) translateY(10px); transition:transform .25s; }
.modal-overlay.open .modal { transform:scale(1) translateY(0); }
.modal-header { padding:24px 28px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--surface); z-index:1; }
.modal-header h3 { font-size:18px; font-weight:800; color:var(--text); }
.modal-close { width:32px; height:32px; border-radius:50%; border:none; background:var(--bg); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:all .2s; color:var(--text2); }
.modal-close:hover { background:#FEE2E2; color:#EF4444; }
.modal-body { padding:24px 28px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-grid .full { grid-column:1/-1; }
.section-divider { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--primary); padding:16px 0 8px; border-top:1px solid var(--border); margin-top:8px; grid-column:1/-1; }
.modal-footer { padding:16px 28px 24px; display:flex; gap:12px; justify-content:flex-end; }
.detail-modal { max-width:800px; }
.detail-tabs { display:flex; gap:4px; padding:0 28px; border-bottom:1px solid var(--border); background:var(--surface); overflow-x:auto; }
.detail-tab { padding:12px 16px; border:none; background:transparent; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:var(--text2); border-bottom:2px solid transparent; transition:all .2s; white-space:nowrap; }
.detail-tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
.detail-section { display:none; }
.detail-section.active { display:block; }
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
.info-item label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); display:block; margin-bottom:4px; }
.info-item span { font-size:14px; color:var(--text); font-weight:500; }
.ganado-section { background:var(--accent-light); border-radius:var(--radius-sm); padding:16px; border:1px solid #A7F3D0; margin-bottom:16px; }
.ganado-section h4 { font-size:13px; font-weight:700; color:var(--accent); margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px; }
.interaction-form { background:var(--bg); border-radius:var(--radius-sm); padding:16px; margin-bottom:16px; border:1px solid var(--border); }
.interactions-list { display:flex; flex-direction:column; gap:10px; }
.interaction-item { background:var(--surface); border-radius:var(--radius-sm); padding:14px; border:1px solid var(--border); }
.interaction-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.interaction-type { font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; background:var(--primary-light); color:var(--primary); }
.interaction-date { font-size:11px; color:var(--text3); margin-left:auto; }
.interaction-author { font-size:11px; color:var(--text2); }
.interaction-desc { font-size:13px; color:var(--text); }
.alert-item { background:var(--surface); border-radius:var(--radius-sm); padding:14px; border:1px solid var(--border); display:flex; align-items:flex-start; gap:12px; margin-bottom:8px; }
.alert-item.vencida { border-color:#FCA5A5; background:#FFF5F5; }
.alert-item.completada { opacity:.6; }
.alert-type-badge { padding:4px 8px; border-radius:4px; font-size:11px; font-weight:700; background:var(--primary-light); color:var(--primary); white-space:nowrap; }
.alert-info { flex:1; }
.alert-title { font-size:14px; font-weight:600; color:var(--text); }
.alert-meta { font-size:12px; color:var(--text2); margin-top:2px; }
.nota-item { background:#FFFBEB; border-radius:var(--radius-sm); padding:14px; border:1px solid #FDE68A; margin-bottom:8px; }
.nota-header { display:flex; justify-content:space-between; margin-bottom:6px; }
.nota-author { font-size:12px; font-weight:600; color:var(--secondary); }
.nota-date { font-size:11px; color:var(--text3); }
.nota-text { font-size:14px; color:var(--text); line-height:1.5; }
.alerts-page-item { background:var(--surface); border-radius:var(--radius); padding:16px 20px; border:1px solid var(--border); margin-bottom:10px; display:flex; align-items:center; gap:16px; transition:all .2s; }
.alerts-page-item:hover { box-shadow:0 4px 16px var(--shadow); }
.alerts-page-item.vencida { border-left:4px solid #EF4444; background:#FFF5F5; }
.alerts-page-item.hoy { border-left:4px solid var(--secondary); }
.admin-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
.user-card { background:var(--surface); border-radius:var(--radius); padding:20px; border:1px solid var(--border); box-shadow:0 2px 8px var(--shadow); }
.user-card-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.user-card-avatar { width:44px; height:44px; border-radius:50%; background:#FF6B35; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:16px; overflow:hidden; }
.role-badge { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.role-admin { background:#EDE9FE; color:#7C3AED; }
.role-jefe { background:#DBEAFE; color:#1D4ED8; }
.role-empleado { background:#D1FAE5; color:#065F46; }
.code-badge { font-family:monospace; font-size:13px; padding:6px 12px; background:var(--bg); border:1.5px dashed var(--border); border-radius:var(--radius-xs); color:var(--text); cursor:pointer; transition:all .2s; }
.code-badge:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.progress-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin:6px 0; }
.progress-fill { height:100%; border-radius:4px; transition:width .4s ease; }
.empty-state { text-align:center; padding:60px 20px; color:var(--text2); }
.empty-state .empty-icon { font-size:48px; margin-bottom:16px; }
.empty-state h3 { font-size:18px; font-weight:700; margin-bottom:8px; color:var(--text); }
.empty-state p { font-size:14px; }
.toast { position:fixed; bottom:24px; right:24px; background:var(--text); color:white; padding:14px 20px; border-radius:var(--radius-sm); font-size:14px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:999; transform:translateY(20px); opacity:0; transition:all .3s; max-width:320px; }
.toast.show { transform:translateY(0); opacity:1; }
.toast.success { background:var(--accent); }
.toast.error { background:#EF4444; }
.alerta-dia-modal { max-width:560px; }
.alerta-dia-item { display:flex; align-items:flex-start; gap:12px; padding:14px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:8px; border:1px solid var(--border); }
.alerta-dia-item.urgente { background:#FFF5F5; border-color:#FCA5A5; }
.bar-chart { padding:8px 0; }
.bar-row { margin-bottom:12px; }
.bar-label-row { display:flex; justify-content:space-between; margin-bottom:4px; font-size:12px; }
.bar-label { color:var(--text2); font-weight:500; }
.bar-count { color:var(--text); font-weight:700; }
.pagination { display:flex; align-items:center; justify-content:center; gap:8px; padding:16px; border-top:1px solid var(--border); }
.page-btn { padding:6px 12px; border:1.5px solid var(--border); border-radius:var(--radius-xs); background:var(--surface); cursor:pointer; font-size:13px; transition:all .2s; }
.page-btn:hover, .page-btn.active { background:var(--primary); color:white; border-color:var(--primary); }

/* LUZ WIDGET */
.luz-card { background:linear-gradient(135deg,#FFF9E6,#FFF0EB); border:1px solid #FDE68A; border-radius:var(--radius); padding:20px; margin-bottom:24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.luz-card h3 { font-size:15px; font-weight:700; color:#D97706; margin-bottom:4px; }
.luz-card p { font-size:13px; color:var(--text2); }
.luz-link { display:inline-flex; align-items:center; gap:8px; padding:10px 18px; background:#FF6B35; color:white; border-radius:var(--radius-sm); text-decoration:none; font-weight:700; font-size:14px; transition:all .2s; white-space:nowrap; }
.luz-link:hover { background:#e55a25; transform:translateY(-1px); }

/* LOADING */
#loading-screen { position:fixed; inset:0; background:linear-gradient(135deg,#E0F5FD,#FFF0EB); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
#loading-screen .logo-icon-sq { width:80px; height:80px; border-radius:22px; margin-bottom:16px; animation:pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.05);opacity:.8} }
#loading-screen p { color:var(--text2); font-size:14px; margin-top:8px; }


/* NOTIF BELL */
.notif-bell-btn {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: #FF6B35;
  color: white;
  border: none;
  border-radius: 50px;
  padding: 12px 22px;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,107,53,0.4);
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 90;
  transition: all 0.2s;
  white-space: nowrap;
}
.notif-bell-btn:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.5); }
.notif-bell-btn.granted { background: var(--accent); box-shadow: 0 6px 20px rgba(76,175,80,0.4); }
.notif-bell-btn.denied { background: var(--text2); box-shadow: none; cursor: not-allowed; }

/* ALERTA eliminable */
.alert-actions { display: flex; gap: 6px; flex-shrink: 0; }

@media(max-width:768px) {
  .hamburger { display:flex; }
  .sidebar { position:fixed; left:-260px; top:0; height:100vh; z-index:101; }
  .sidebar.open { left:0; }
  .sidebar-overlay.open { display:block; }
  .page-header { padding:14px 18px; }
  .page-body { padding:14px 18px; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .dashboard-grid { grid-template-columns:1fr; }
  .form-grid { grid-template-columns:1fr; }
  .info-grid { grid-template-columns:1fr; }
  .clients-table th:nth-child(n+4), .clients-table td:nth-child(n+4) { display:none; }
  .modal { max-width:100%; border-radius:20px 20px 0 0; }
  .modal-overlay { align-items:flex-end; padding:0; }
  .accesos-grid { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:480px) {
  .stats-grid { grid-template-columns:1fr 1fr; }
  .auth-card { padding:28px 20px; }
}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBO_7QBhcbifhcHCY4DKhX4iDIIqcixTl0",
  authDomain: "crm-energypro.firebaseapp.com",
  projectId: "crm-energypro",
  storageBucket: "crm-energypro.firebasestorage.app",
  messagingSenderId: "100297669082",
  appId: "1:100297669082:web:43ab765577fd177e8ee8e3"
};

const fireApp = initializeApp(firebaseConfig);
const db = getFirestore(fireApp);

// ─── STATE ───────────────────────────────────────────
let currentUser = null;
let allUsers = [];
let allClientes = [];
let allCodigos = [];
let currentPage = 'dashboard';
let clientesPagina = 1;
const PER_PAGE = 20;
let filterEstado = '';
let filterEmpleado = '';
let filterVista = 'todos';
let searchTerm = '';
let unsubClientes = null;

// ─── HELPERS ─────────────────────────────────────────
const col = (name) => collection(db, name);
const docRef = (name, id) => doc(db, name, id);

async function loadAllUsers() {
  const snap = await getDocs(col('users'));
  allUsers = snap.docs.map(d => ({id: d.id, ...d.data()}));
}
async function loadAllCodigos() {
  const snap = await getDocs(col('codigos'));
  allCodigos = snap.docs.map(d => ({id: d.id, ...d.data()}));
}

function subscribeClientes() {
  if (unsubClientes) unsubClientes();
  unsubClientes = onSnapshot(col('clientes'), snap => {
    allClientes = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if (currentPage === 'clientes') renderClientes();
    if (currentPage === 'dashboard') renderDashboard();
    updateAlertasBadge();
  });
}

// ─── INIT ─────────────────────────────────────────────
async function initAdmin() {
  const adminSnap = await getDoc(docRef('users','admin'));
  if (!adminSnap.exists()) {
    await setDoc(docRef('users','admin'), {
      name:'Admin EnergyPro', email:'admin@energypro.com', password:'admin123',
      role:'admin', jefe_id:null, activo:true, foto:null, drive_url:'',
      creado: new Date().toISOString()
    });
    // Default invite codes
    await setDoc(docRef('codigos','JEFE2024'), { role:'jefe', jefe_id:null, usado:false, creado:new Date().toISOString() });
    await setDoc(docRef('codigos','EMP2024A'), { role:'empleado', jefe_id:null, usado:false, creado:new Date().toISOString() });
  }
}

// ─── AUTH ─────────────────────────────────────────────
window.switchAuthTab = (tab, el) => {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
  document.getElementById('auth-error').style.display = 'none';
};

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
}

window.doLogin = async () => {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass = document.getElementById('login-password').value;
  const snap = await getDocs(col('users'));
  const user = snap.docs.map(d=>({id:d.id,...d.data()})).find(u => u.email.toLowerCase()===email && u.password===pass && u.activo);
  if (!user) { showAuthError('Email o contraseña incorrectos'); return; }
  currentUser = user;
  await loadAllUsers();
  await loadAllCodigos();
  subscribeClientes();
  showApp();
  checkAlertasDelDia();
};

window.doRegister = async () => {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const pass = document.getElementById('reg-password').value;
  const code = document.getElementById('reg-code').value.trim().toUpperCase();
  if (!name||!email||!pass||!code) { showAuthError('Rellena todos los campos'); return; }
  if (pass.length < 6) { showAuthError('Contraseña mínimo 6 caracteres'); return; }
  const snap = await getDocs(col('users'));
  if (snap.docs.find(d => d.data().email.toLowerCase()===email)) { showAuthError('Email ya registrado'); return; }
  const codigoSnap = await getDoc(docRef('codigos', code));
  if (!codigoSnap.exists() || codigoSnap.data().usado) { showAuthError('Código inválido o ya usado'); return; }
  const codigoData = codigoSnap.data();
  const newId = 'u'+Date.now();
  await setDoc(docRef('users', newId), { name, email, password:pass, role:codigoData.role, jefe_id:codigoData.jefe_id||null, activo:true, foto:null, drive_url:'', creado:new Date().toISOString() });
  await updateDoc(docRef('codigos', code), { usado:true });
  currentUser = { id:newId, name, email, role:codigoData.role, jefe_id:codigoData.jefe_id||null, activo:true };
  await loadAllUsers(); await loadAllCodigos(); subscribeClientes();
  showApp();
};

window.doLogout = () => {
  if (unsubClientes) unsubClientes();
  currentUser = null; allClientes = []; allUsers = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
};

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const av = document.getElementById('sidebar-avatar');
  av.innerHTML = currentUser.foto ? `<img src="${currentUser.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : currentUser.name.charAt(0).toUpperCase();
  document.getElementById('sidebar-name').textContent = currentUser.name;
  const roles = {admin:'👑 Super Admin', jefe:'🏢 Jefe', empleado:'👤 Empleado'};
  document.getElementById('sidebar-role').textContent = roles[currentUser.role];

window.navigateTo = (page) => {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const titles = {dashboard:'Dashboard',clientes:'Clientes',alertas:'Alertas',admin:'Panel de Administración'};
  document.getElementById('page-title').textContent = titles[page]||page;
  document.getElementById('page-'+page).classList.add('active');
  const navMap = {dashboard:0,clientes:1,alertas:2};
  const navItems = document.querySelectorAll('.nav-item');
  if (navMap[page] !== undefined) navItems[navMap[page]].classList.add('active');
  closeSidebar();
  const ha = document.getElementById('header-actions');
  ha.innerHTML = '';
  if (page==='clientes') { ha.innerHTML=`<button class="btn-primary" style="width:auto;padding:10px 20px;font-size:14px" onclick="openNuevoCliente()">+ Nuevo cliente</button>`; renderClientes(); }

};

function renderDashboard() {

  mis.forEach(c => { if(counts[c.estado]!==undefined) counts[c.estado]++; });

  const alertasHoy = getTodasAlertas().filter(a => a.estado==='Pendiente' && a.fecha===hoy);
  const alertasPend = getTodasAlertas().filter(a => a.estado==='Pendiente' && a.fecha<=hoy);
  const recientes = [...mis].sort((a,b)=>new Date(b.creado)-new Date(a.creado)).slice(0,5);
  const maxCount = Math.max(1,...Object.values(counts));
  const estadoColors = {'Factura recibida':'#F59E0B','Propuesta enviada':'#3B82F6','Cerrado ganado':'#10B981','Cerrado perdido':'#EF4444','Ahorro':'#8B5CF6','Comisión':'#EC4899'};

          ${emps.map(e => {

          }).join('')}
        </tbody></table>
      </div>`;
  }
  document.getElementById('page-dashboard').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card primary"><div class="stat-label">Total clientes</div><div class="stat-value">${mis.length}</div><div class="stat-sub">en cartera</div></div>
      <div class="stat-card accent"><div class="stat-label">Cerrados ganados</div><div class="stat-value">${counts['Cerrado ganado']}</div><div class="stat-sub">contratos activos</div></div>
      <div class="stat-card secondary"><div class="stat-label">Alertas hoy</div><div class="stat-value">${alertasHoy.length}</div><div class="stat-sub">pendientes</div></div>
      <div class="stat-card purple"><div class="stat-label">En propuesta</div><div class="stat-value">${counts['Propuesta enviada']}</div><div class="stat-sub">esperando resp.</div></div>
    </div>
    <div class="dashboard-grid">
      <div class="card">
        <h3>📊 Clientes por estado</h3>
        <div class="bar-chart">
          ${estados.map(e=>`<div class="bar-row"><div class="bar-label-row"><span class="bar-label">${e}</span><span class="bar-count">${counts[e]}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${(counts[e]/maxCount)*100}%;background:${estadoColors[e]}"></div></div></div>`).join('')}
        </div>
      </div>
      <div class="card">
        <h3>🕐 Últimos clientes</h3>
        ${recientes.length===0?'<p style="color:var(--text3);font-size:14px">Sin clientes aún</p>':recientes.map(c=>`
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openClienteDetail('${c.id}')">
            <div style="width:36px;height:36px;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--primary)">${c.nombre.charAt(0)}</div>

// ─── CLIENTES ─────────────────────────────────────────
function getClientesVisibles() {
  if (currentUser.role==='admin') return allClientes;
  if (currentUser.role==='jefe') {
    const empIds = allUsers.filter(u=>u.jefe_id===currentUser.id).map(u=>u.id);
    if (filterVista==='mios') return allClientes.filter(c=>c.empleado_id===currentUser.id);
    if (filterVista==='empleados') return allClientes.filter(c=>empIds.includes(c.empleado_id));
    return allClientes.filter(c=>c.empleado_id===currentUser.id||empIds.includes(c.empleado_id));
  }
  return allClientes.filter(c=>c.empleado_id===currentUser.id);
}

function getEmpleadosBajoMi() {
  if (currentUser.role==='admin') return allUsers.filter(u=>u.role==='empleado');
  return allUsers.filter(u=>u.jefe_id===currentUser.id);
}

function renderClientes() {
  let clientes = getClientesVisibles();
  if (searchTerm) { const s=searchTerm.toLowerCase(); clientes=clientes.filter(c=>c.nombre.toLowerCase().includes(s)||(c.nif||'').toLowerCase().includes(s)||(c.email||'').toLowerCase().includes(s)||(c.telefono||'').includes(s)||(c.cups||'').toLowerCase().includes(s)); }
  if (filterEstado) clientes=clientes.filter(c=>c.estado===filterEstado);
  if (filterEmpleado) clientes=clientes.filter(c=>c.empleado_id===filterEmpleado);
  const total=clientes.length, totalPages=Math.max(1,Math.ceil(total/PER_PAGE));
  if (clientesPagina>totalPages) clientesPagina=1;
  const pag=clientes.slice((clientesPagina-1)*PER_PAGE,clientesPagina*PER_PAGE);
  const isJA=currentUser.role!=='empleado';
  const emps=getEmpleadosBajoMi();
  let vistaF=''; if(currentUser.role==='jefe') vistaF=`<select class="filter-select" onchange="filterVista=this.value;clientesPagina=1;renderClientes()"><option value="todos" ${filterVista==='todos'?'selected':''}>Todos</option><option value="mios" ${filterVista==='mios'?'selected':''}>Solo míos</option><option value="empleados" ${filterVista==='empleados'?'selected':''}>Empleados</option></select>`;
  let empF=''; if(isJA&&emps.length>0) empF=`<select class="filter-select" onchange="filterEmpleado=this.value;clientesPagina=1;renderClientes()"><option value="">Todos empleados</option>${emps.map(e=>`<option value="${e.id}" ${filterEmpleado===e.id?'selected':''}>${e.name}</option>`).join('')}</select>`;
  document.getElementById('page-clientes').innerHTML=`
    <div class="filters-bar">
      <div class="search-wrapper"><input class="search-input" placeholder="Buscar nombre, NIF, CUPS, teléfono..." value="${searchTerm}" oninput="searchTerm=this.value;clientesPagina=1;renderClientes()"></div>
      <select class="filter-select" onchange="filterEstado=this.value;clientesPagina=1;renderClientes()">
        <option value="">Todos los estados</option>
        ${['Factura recibida','Propuesta enviada','Cerrado ganado','Cerrado perdido','Ahorro','Comisión'].map(s=>`<option value="${s}" ${filterEstado===s?'selected':''}>${s}</option>`).join('')}
      </select>
      ${empF}${vistaF}
      <span style="font-size:13px;color:var(--text2);white-space:nowrap">${total} cliente${total!==1?'s':''}</span>
    </div>
    <div class="clients-table-wrap">
      <table class="clients-table">
        <thead><tr><th>Cliente</th><th>Tipo</th><th>Estado</th><th>Teléfono</th><th>Asignado a</th><th>Fecha alta</th></tr></thead>
        <tbody>
          ${pag.length===0?`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p>Prueba otros filtros</p></div></td></tr>`:
            pag.map(c=>{const emp=allUsers.find(u=>u.id===c.empleado_id);return`<tr onclick="openClienteDetail('${c.id}')"><td><div class="client-name">${c.nombre}</div>${c.cups?`<div class="client-cups">${c.cups}</div>`:''}</td><td>${suministroBadge(c.tipo_suministro)}</td><td>${estadoBadge(c.estado)}</td><td style="font-size:13px">${c.telefono||'-'}</td><td style="font-size:13px;color:var(--text2)">${emp?emp.name:'-'}</td><td style="font-size:13px;color:var(--text2)">${formatDate(c.creado)}</td></tr>`;}).join('')}
        </tbody>
      </table>
      ${totalPages>1?`<div class="pagination"><button class="page-btn" onclick="clientesPagina=Math.max(1,clientesPagina-1);renderClientes()" ${clientesPagina===1?'disabled':''}>‹</button>${Array.from({length:totalPages},(_,i)=>`<button class="page-btn ${clientesPagina===i+1?'active':''}" onclick="clientesPagina=${i+1};renderClientes()">${i+1}</button>`).join('')}<button class="page-btn" onclick="clientesPagina=Math.min(${totalPages},clientesPagina+1);renderClientes()" ${clientesPagina===totalPages?'disabled':''}>›</button></div>`:''}
    </div>`;
}

window.filterVista = filterVista;
window.filterEstado = filterEstado;
window.filterEmpleado = filterEmpleado;
window.searchTerm = searchTerm;
window.clientesPagina = clientesPagina;
window.renderClientes = renderClientes;

  const empEl = document.getElementById('nc-empleado');

// ─── NOTIFICACIONES PUSH ──────────────────────────────
function initNotifications() {
  const btn = document.getElementById('notif-bell-btn');
  if (!('Notification' in window)) {
    btn.innerHTML = '🔕 Notif. no disponibles';
    btn.classList.add('denied');
    return;
  }
  if (Notification.permission === 'granted') {
    btn.innerHTML = '🔔 Notificaciones activas';
    btn.classList.add('granted');
    scheduleNotifications();
  } else if (Notification.permission === 'denied') {
    btn.innerHTML = '🔕 Bloqueadas en navegador';
    btn.classList.add('denied');
  } else {
    btn.innerHTML = '🔔 Activar notificaciones';
  }
}

window.requestNotifPermission = async () => {
  if (!('Notification' in window)) { showToast('Tu navegador no soporta notificaciones', 'error'); return; }
  const perm = await Notification.requestPermission();
  const btn = document.getElementById('notif-bell-btn');
  if (perm === 'granted') {
    btn.innerHTML = '🔔 Notificaciones activas';
    btn.className = 'notif-bell-btn granted';
    scheduleNotifications();
    showToast('¡Notificaciones activadas!', 'success');
    new Notification('EnergyPro ⚡', { body: 'Las notificaciones están activas. Te avisaremos de tus alertas.', icon: '' });
  } else {
    btn.innerHTML = '🔕 Notificaciones bloqueadas';
    btn.className = 'notif-bell-btn denied';
    showToast('Notificaciones bloqueadas en el navegador', 'error');
  }
};

function scheduleNotifications() {
  // Check every minute for due alerts
  if (window._notifInterval) clearInterval(window._notifInterval);
  window._notifInterval = setInterval(() => {
    checkAndSendNotifications();
  }, 60000); // every 60s
  checkAndSendNotifications(); // check immediately
}

function checkAndSendNotifications() {
  if (Notification.permission !== 'granted') return;
  const now = new Date();
  const hoy = now.toISOString().split('T')[0];
  const horaActual = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  const alertas = getTodasAlertas().filter(a => a.estado === 'Pendiente');
  alertas.forEach(a => {
    const key = `notif_sent_${a.id}_${a.fecha}`;
    if (localStorage.getItem(key)) return; // already notified

    const esHoy = a.fecha === hoy;
    const esVencida = a.fecha < hoy;
    const tieneHora = a.hora && a.hora.length > 0;
    const horaMatch = tieneHora ? a.hora === horaActual : true;

    if (esVencida && !localStorage.getItem(key + '_venc')) {
      localStorage.setItem(key + '_venc', '1');
      new Notification('⚠️ Alerta vencida — ' + a.clienteNombre, {
        body: a.tipo + ': ' + a.desc + '\nFecha: ' + a.fecha,
        tag: key + '_venc'
      });
    } else if (esHoy && horaMatch) {
      localStorage.setItem(key, '1');
      new Notification('🕐 Alerta — ' + a.clienteNombre, {
        body: a.tipo + ': ' + a.desc + (a.hora ? '\nHora: ' + a.hora : ''),
        tag: key
      });
    }
  });
}

function renderAlertas() {
  const hoy=new Date().toISOString().split('T')[0];
  const todas=getTodasAlertas().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const venc=todas.filter(a=>a.estado==='Pendiente'&&a.fecha<hoy);

  const fut=todas.filter(a=>a.estado==='Pendiente'&&a.fecha>hoy);
  const comp=todas.filter(a=>a.estado==='Completada');
  const renderGrupo=(als,titulo,color)=>{if(!als.length) return '';return`<div style="margin-bottom:24px"><h3 style="font-size:14px;font-weight:700;color:${color};margin-bottom:12px">${titulo} (${als.length})</h3>${als.map(a=>`<div class="alerts-page-item ${a.fecha<hoy&&a.estado==='Pendiente'?'vencida':''} ${a.fecha===hoy?'hoy':''}"><div class="alert-type-badge">${a.tipo}</div><div style="flex:1"><div style="font-size:14px;font-weight:600">${a.desc}</div><div style="font-size:12px;color:var(--text2);margin-top:2px"><span style="cursor:pointer;text-decoration:underline" onclick="openClienteDetail('${a.clienteId}')">${a.clienteNombre}</span> · ${a.fecha}${a.hora?' · '+a.hora:''}</div></div>${a.estado==='Pendiente'?`<div class="alert-actions"><button class="btn-green btn-sm" onclick="completarAlertaGlobal('${a.clienteId}','${a.id}')">✓</button><button class="btn-danger" onclick="eliminarAlertaGlobal('${a.clienteId}','${a.id}')">🗑</button></div>`:'<span style="font-size:12px;color:var(--accent)">✓ Hecho</span>'}</div>`).join('')}</div>`;};
  document.getElementById('page-alertas').innerHTML=`
    ${!todas.length?'<div class="empty-state"><div class="empty-icon">🎉</div><h3>¡Todo al día!</h3><p>No hay alertas pendientes</p></div>':''}
    ${renderGrupo(venc,'⚠️ Vencidas','#EF4444')}
    ${renderGrupo(hoyAl,'📅 Hoy','var(--secondary)')}
    ${renderGrupo(fut,'🗓️ Próximas','var(--primary)')}
    ${comp.length?`<details><summary style="cursor:pointer;font-size:14px;color:var(--text2);padding:8px 0">Ver completadas (${comp.length})</summary><div style="margin-top:8px">${renderGrupo(comp,'✅ Completadas','var(--accent)')}</div></details>`:''}`;
}

  const alertas=[...(c.alertas||[]),{id:'a'+Date.now(),tipo:document.getElementById('ag-tipo').value,fecha,hora:document.getElementById('ag-hora').value,desc,estado:'Pendiente'}];
  await updateDoc(docRef('clientes',clienteId),{alertas});
  updateAlertasBadge(); closeModal(); showToast('Alerta creada para '+c.nombre,'success');
  if(currentPage==='alertas') renderAlertas();
};

// ─── PERFIL ───────────────────────────────────────────
window.openMiPerfil = () => {
  const u=currentUser;
  openModal('Mi perfil',`
    <div style="text-align:center;margin-bottom:24px">
      <div id="perfil-avatar-preview" style="width:80px;height:80px;border-radius:50%;background:#FF6B35;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px;font-weight:700;color:white;overflow:hidden;cursor:pointer" onclick="document.getElementById('perfil-foto-input').click()">
        ${u.foto?`<img src="${u.foto}" style="width:100%;height:100%;object-fit:cover">`:u.name.charAt(0).toUpperCase()}
      </div>
      <input type="file" id="perfil-foto-input" accept="image/*" class="hidden" onchange="previewFoto(this)">
      <div style="font-size:12px;color:var(--text3)">Toca el avatar para cambiar foto</div>
    </div>
    <div class="form-grid">
      <div class="form-group full"><label>Nombre completo</label><input id="perfil-nombre" value="${u.name}"></div>
      <div class="form-group full"><label>Email</label><input id="perfil-email" value="${u.email}" type="email"></div>
      <div class="form-group full"><label>Nueva contraseña (vacío = no cambiar)</label><input id="perfil-pass" type="password" placeholder="Nueva contraseña..."></div>
      ${u.role==='jefe'?`<div class="form-group full"><label>🗂️ URL carpeta raíz Google Drive</label><input id="perfil-drive" value="${u.drive_url||''}" placeholder="https://drive.google.com/..."></div>`:''}
    </div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn-primary" style="width:auto" onclick="saveMiPerfil()">Guardar</button>`
  );
};
window.previewFoto = (input) => {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{const p=document.getElementById('perfil-avatar-preview');p.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;p.dataset.foto=e.target.result;};
  reader.readAsDataURL(file);
};
window.saveMiPerfil = async () => {
  const nombre=document.getElementById('perfil-nombre').value.trim(),email=document.getElementById('perfil-email').value.trim(),pass=document.getElementById('perfil-pass').value;
  if(!nombre||!email){showToast('Nombre y email obligatorios','error');return;}
  const data={name:nombre,email};
  if(pass) data.password=pass;
  const preview=document.getElementById('perfil-avatar-preview');
  if(preview.dataset.foto) data.foto=preview.dataset.foto;
  const driveEl=document.getElementById('perfil-drive');
  if(driveEl) data.drive_url=driveEl.value.trim();
  await updateDoc(docRef('users',currentUser.id),data);
  Object.assign(currentUser,data);
  const av=document.getElementById('sidebar-avatar');
  av.innerHTML=currentUser.foto?`<img src="${currentUser.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:currentUser.name.charAt(0).toUpperCase();
  document.getElementById('sidebar-name').textContent=currentUser.name;
  closeModal(); showToast('Perfil actualizado','success');
};

// ─── ADMIN ────────────────────────────────────────────
function renderAdmin() {
  if(currentUser.role!=='admin'){document.getElementById('page-admin').innerHTML='<div class="empty-state"><div class="empty-icon">🔒</div><h3>Acceso restringido</h3></div>';return;}
  const jefes=allUsers.filter(u=>u.role==='jefe');
  const emps=allUsers.filter(u=>u.role==='empleado');
  document.getElementById('page-admin').innerHTML=`
    <div style="display:grid;gap:24px">
      <div class="card">
        <h3 style="margin-bottom:16px">👥 Jefes (${jefes.length})</h3>
        <div class="admin-grid">${jefes.map(u=>`<div class="user-card"><div class="user-card-header"><div class="user-card-avatar">${u.foto?`<img src="${u.foto}" style="width:100%;height:100%;object-fit:cover">`:u.name.charAt(0)}</div><div><div style="font-weight:700">${u.name}</div><div style="font-size:12px;color:var(--text2)">${u.email}</div></div><span class="role-badge role-jefe">Jefe</span></div><div style="font-size:12px;color:var(--text2)">Empleados: ${allUsers.filter(e=>e.jefe_id===u.id).length} · Clientes: ${allClientes.filter(c=>c.empleado_id===u.id||allUsers.filter(e=>e.jefe_id===u.id).map(e=>e.id).includes(c.empleado_id)).length}</div><div style="margin-top:10px"><button class="btn-danger" onclick="toggleUserActivo('${u.id}')">${u.activo?'Desactivar':'Activar'}</button></div></div>`).join('')}</div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:16px">👤 Empleados (${emps.length})</h3>
        <div class="admin-grid">${emps.map(u=>{const j=allUsers.find(x=>x.id===u.jefe_id);return`<div class="user-card"><div class="user-card-header"><div class="user-card-avatar">${u.foto?`<img src="${u.foto}" style="width:100%;height:100%;object-fit:cover">`:u.name.charAt(0)}</div><div><div style="font-weight:700">${u.name}</div><div style="font-size:12px;color:var(--text2)">${u.email}</div></div><span class="role-badge role-empleado">Emp.</span></div><div style="font-size:12px;color:var(--text2)">Jefe: ${j?j.name:'Sin asignar'} · Clientes: ${allClientes.filter(c=>c.empleado_id===u.id).length}</div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn-danger" onclick="toggleUserActivo('${u.id}')">${u.activo?'Desactivar':'Activar'}</button><button class="btn-sm btn-secondary" onclick="openReasignarJefe('${u.id}')">Cambiar jefe</button></div></div>`;}).join('')}</div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:16px">🎟️ Códigos de invitación</h3>
        <div style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn-green btn-sm" onclick="generarCodigo('jefe',null)">➕ Código para Jefe</button>
          ${jefes.map(j=>`<button class="btn-sm btn-secondary" onclick="generarCodigo('empleado','${j.id}')">➕ Emp. → ${j.name.split(' ')[0]}</button>`).join('')}
        </div>
        <table class="clients-table"><thead><tr><th>Código</th><th>Rol</th><th>Jefe</th><th>Estado</th><th></th></tr></thead><tbody>
          ${allCodigos.length===0?'<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:20px">Sin códigos</td></tr>':
            allCodigos.map(cod=>{const j=allUsers.find(u=>u.id===cod.jefe_id);return`<tr><td><span class="code-badge" onclick="copiarCodigo('${cod.id}')">${cod.id}</span></td><td><span class="role-badge ${cod.role==='jefe'?'role-jefe':'role-empleado'}">${cod.role}</span></td><td style="font-size:13px">${j?j.name:'-'}</td><td>${cod.usado?'<span style="color:var(--accent);font-size:12px">✓ Usado</span>':'<span style="color:var(--secondary);font-size:12px">⏳ Pendiente</span>'}</td><td>${!cod.usado?`<button class="btn-danger" onclick="eliminarCodigo('${cod.id}')">Eliminar</button>`:''}</td></tr>`;}).join('')}
        </tbody></table>
      </div>
    </div>`;
}
window.toggleUserActivo = async (id) => {
  if(id===currentUser.id){showToast('No puedes desactivarte a ti mismo','error');return;}
  const u=allUsers.find(x=>x.id===id);
  await updateDoc(docRef('users',id),{activo:!u.activo});
  await loadAllUsers(); showToast(`Usuario ${u.activo?'desactivado':'activado'}`,'success'); renderAdmin();
};
window.openReasignarJefe = (empId) => {
  const jefes=allUsers.filter(u=>u.role==='jefe'),emp=allUsers.find(u=>u.id===empId);
  openModal('Cambiar jefe',`<div class="form-group"><label>Empleado: <strong>${emp.name}</strong></label><select id="nuevo-jefe-id"><option value="">Sin jefe</option>${jefes.map(j=>`<option value="${j.id}" ${emp.jefe_id===j.id?'selected':''}>${j.name}</option>`).join('')}</select></div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn-primary" style="width:auto" onclick="saveReasignarJefe('${empId}')">Guardar</button>`);
};
window.saveReasignarJefe = async (empId) => {
  await updateDoc(docRef('users',empId),{jefe_id:document.getElementById('nuevo-jefe-id').value||null});
  await loadAllUsers(); closeModal(); showToast('Jefe actualizado','success'); renderAdmin();
};
window.generarCodigo = async (role, jefeId) => {
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code=''; for(let i=0;i<8;i++) code+=chars[Math.floor(Math.random()*chars.length)];
  await setDoc(docRef('codigos',code),{role,jefe_id:jefeId,usado:false,creado:new Date().toISOString()});
  await loadAllCodigos(); showToast(`Código: ${code}`,'success'); renderAdmin();
};
window.eliminarCodigo = async (code) => {
  await deleteDoc(docRef('codigos',code));
  await loadAllCodigos(); renderAdmin();
};
window.copiarCodigo = (code) => {
  navigator.clipboard.writeText(code).then(()=>showToast('Código copiado: '+code,'success'));
};

// ─── MODAL ────────────────────────────────────────────
window.openModal = (title,body,footer,noClose) => {
  document.getElementById('modal-content').innerHTML=`
    <div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer?`<div class="modal-footer">${footer}</div>`:''}`;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-content').classList.remove('detail-modal');
};
window.closeModal = () => document.getElementById('modal-overlay').classList.remove('open');
window.closeModalOverlay = (e) => { if(e.target===document.getElementById('modal-overlay')) closeModal(); };

// ─── HELPERS ──────────────────────────────────────────
function estadoBadge(estado) {
  const map={'Factura recibida':'factura','Propuesta enviada':'propuesta','Cerrado ganado':'ganado','Cerrado perdido':'perdido','Ahorro':'ahorro','Comisión':'comision'};
  const icons={'Factura recibida':'🧾','Propuesta enviada':'📨','Cerrado ganado':'✅','Cerrado perdido':'❌','Ahorro':'💚','Comisión':'💰'};
  return `<span class="estado-badge estado-${map[estado]||'factura'}">${icons[estado]||''} ${estado}</span>`;
}
function suministroBadge(tipo) {
  const map={'Luz':'sum-luz','Gas':'sum-gas','Ambos':'sum-ambos'};
  const icons={'Luz':'⚡','Gas':'🔥','Ambos':'⚡🔥'};
  return `<span class="suministro-badge ${map[tipo]||'sum-luz'}">${icons[tipo]||''} ${tipo}</span>`;
}
function formatDate(iso) { if(!iso) return '-'; return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function formatDateTime(iso) { if(!iso) return '-'; return new Date(iso).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function showToast(msg,type='') { const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',3200); }

// ─── BOOT ─────────────────────────────────────────────
(async () => {
  try {
    await initAdmin();
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  } catch(e) {
    document.getElementById('loading-screen').querySelector('p').textContent = 'Error de conexión. Comprueba tu internet.';
    console.error(e);
  }
})();

</script>
</body>
</html>
